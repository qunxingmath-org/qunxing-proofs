name: verify-proof
on:
  pull_request:
    paths: ["ci/**", ".github/workflows/ver-010.yml"]
  pull_request_target:
    paths: ["submissions/**"]
  schedule:
    - cron: "23 4 * * *"

permissions: {}
concurrency:
  group: verify-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'qunxingmath-org/qunxing-proofs' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      queue: ${{ steps.queue.outputs.matrix }}
    env:
      TRUSTED: ${{ github.event.pull_request.base.sha || github.sha }}
      CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Load immutable Git objects from this public repository
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout --filter=blob:none https://github.com/qunxingmath-org/qunxing-proofs.git proofs
          git -C proofs fetch --quiet origin "$TRUSTED" "$CANDIDATE"
          mkdir trusted
          git -C proofs archive "$TRUSTED" ci | tar -xf - -C trusted
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml python3-jsonschema
      - name: Check submission data
        if: github.event_name == 'pull_request_target'
        run: |
          set -euo pipefail
          if [ "$AUTHOR" != 'qunxing-math-bot[bot]' ]; then
            git -C proofs diff --name-only "$TRUSTED" "$CANDIDATE" -- submissions/ > changed.txt
            if grep -q '/verification\.json$' changed.txt; then
              echo "Only the report importer can write verification.json." >&2
              exit 1
            fi
          fi
          /usr/bin/python3 trusted/ci/gate.py proofs "$CANDIDATE" --base "$TRUSTED"
      - name: Plan the daily queue
        id: queue
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          matrix=$(/usr/bin/python3 trusted/ci/gate.py proofs "$TRUSTED" --queue)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  replay:
    if: >-
      github.event_name == 'schedule' && needs.gate.outputs.queue != '' &&
      needs.gate.outputs.queue != '{"include": []}'
    needs: gate
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.gate.outputs.queue) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      SUBMISSION: ${{ matrix.submission }}
    steps:
      - name: Stage trusted tools and canonical Mathlib
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout --filter=blob:none https://github.com/qunxingmath-org/qunxing-proofs.git proofs
          git -C proofs fetch --quiet origin "$SOURCE_COMMIT"
          mkdir trusted
          git -C proofs archive "$SOURCE_COMMIT" ci | tar -xf - -C trusted
          sudo apt-get update -qq
          sudo apt-get install -y -qq apparmor bubblewrap zstd python3-yaml python3-jsonschema
          bash trusted/ci/prepare-bwrap.sh
          bash trusted/ci/prepare-tools.sh "$RUNNER_TEMP/lean-work"
      - name: Replay isolated Lean proof
        run: |
          set -euo pipefail
          /usr/bin/python3 trusted/ci/replay.py proofs "$SOURCE_COMMIT" "$SUBMISSION" \
            "$RUNNER_TEMP/lean-work/lean" "$RUNNER_TEMP/lean-work/mathlib" "$RUNNER_TEMP/verification.json"
          /usr/bin/python3 - "$RUNNER_TEMP/verification.json" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print(report["status"], report["reason"])
          sys.exit(report["status"] == "FAIL")
          PY
      - name: Save verification evidence
        if: always() && hashFiles('trusted/ci/replay.py') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-replay-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verification.json
          retention-days: 90
          if-no-files-found: error

  tooling-test:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Exercise the boundary and actual verifier
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apparmor bubblewrap zstd python3-yaml python3-jsonschema
          /usr/bin/python3 -B ci/test_gate.py -v
          bash ci/prepare-bwrap.sh
          bash ci/prepare-tools.sh "$RUNNER_TEMP/lean-smoke" --lean-only
          /usr/bin/python3 -B ci/smoke.py "$RUNNER_TEMP/lean-smoke/lean"
